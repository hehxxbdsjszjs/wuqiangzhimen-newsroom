<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="app-version" content="v17-stable">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="无墙之门" />
  <meta name="theme-color" content="#20221f" />
  <meta name="format-detection" content="telephone=no" />
  <title>无墙之门 · Newsroom Studio</title>
  <link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxODAiIGhlaWdodD0iMTgwIiB2aWV3Qm94PSIwIDAgMTgwIDE4MCI+PHJlY3Qgd2lkdGg9IjE4MCIgaGVpZ2h0PSIxODAiIGZpbGw9IiMyMDIyMWYiLz48Y2lyY2xlIGN4PSI5MCIgY3k9IjkwIiByPSI2MCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZDViOTZmIiBzdHJva2Utd2lkdGg9IjIiLz48dGV4dCB4PSI5MCIgeT0iMTAwIiBmb250LWZhbWlseT0iR2VvcmdpYSIgZm9udC1zaXplPSIzMiIgZmlsbD0iI2Q1Yjk2ZiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC13ZWlnaHQ9ImJvbGQiPuatjeW8gizovIM8L3RleHQ+PC9zdmc+" />
  <style>
    :root{
      --ink:#181917;
      --paper:#f7f3e9;
      --dark:#20221f;
      --line:#b7b0a1;
      --red:#b54a37;
      --sp-red:#a91d1d;
      --sp-bg:#ffffff;
      --body-size:16px;
    }
    *{box-sizing:border-box}
    body{margin:0;background:#dedcd5;color:var(--ink);font-family:Georgia,"PingFang SC",Arial,sans-serif;overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}

    /* ===== 导航 ===== */
    .nav{height:58px;background:var(--dark);color:#f7f3e9;display:flex;align-items:center;padding:0 16px;padding-top:env(safe-area-inset-top);gap:12px;position:sticky;top:0;z-index:50}
    .mark{border:1px solid #e9e2d0;font:22px Georgia;padding:1px 7px;flex-shrink:0}
    .brand{font:15px Georgia;white-space:nowrap;flex-shrink:0}
    .tabs{display:flex;height:100%;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;flex-shrink:1;min-width:0}
    .tabs button{color:#bbb7ae;background:none;border:0;border-bottom:2px solid transparent;padding:0 14px;font-size:14px;cursor:pointer;transition:color .2s;white-space:nowrap;flex-shrink:0}
    .tabs button.on{color:#fff;border-color:#d5b96f}
    .tabs button:hover{color:#e5e0d5}
    .undo-btn{margin-left:auto;border:1px solid #6a6c66;background:transparent;color:#e5e0d5;padding:7px 12px;font-size:13px;cursor:pointer;border-radius:2px;transition:all .15s;display:flex;align-items:center;gap:6px;flex-shrink:0}
    .undo-btn:hover{background:#3a3c38;border-color:#d5b96f}
    .undo-btn:disabled{opacity:.4;cursor:not-allowed}
    .panel-toggle{display:none}

    /* ===== 顶部操作台布局 ===== */
    .tool{display:flex;flex-direction:column;min-height:calc(100vh - 58px)}
    .panel{background:var(--dark);padding:14px 24px;color:#eee8dc;display:flex;flex-direction:row;flex-wrap:wrap;align-items:stretch;gap:0;overflow-x:auto;overflow-y:auto;max-height:46vh;border-bottom:2px solid #6a6859}
    .panel-section{flex:1;min-width:220px;display:flex;flex-direction:column;gap:8px;padding:0 14px;border-right:1px solid #555850}
    .panel-section:first-child{padding-left:0}
    .panel-section:last-child{border-right:0}
    .panel-section b{font-size:13px;letter-spacing:.5px;color:#d5b96f;margin-bottom:4px;text-transform:uppercase}
    .label{font-size:11px;letter-spacing:1.3px;color:#c0baae;display:grid;gap:5px}
    .label input,.label textarea,.label select{font:13px Georgia,"PingFang SC",Arial;background:#2d2f2c;border:1px solid #555850;color:#fff;padding:7px 9px;width:100%;border-radius:2px}
    .label input:focus,.label textarea:focus,.label select:focus{outline:0;border-color:#d5b96f}
    .label textarea{height:90px;resize:vertical;font-family:"SF Mono","Menlo",Consolas,monospace;font-size:12px;line-height:1.5}
    .note{font-size:11px;line-height:1.5;color:#aaa499;margin:0}
    .buttons{display:flex;border:1px solid #555850;border-radius:2px;overflow:hidden}
    .buttons button{flex:1;border:0;border-right:1px solid #555850;background:transparent;color:#ddd6c8;padding:7px;cursor:pointer;font-size:12px;transition:background .15s}
    .buttons button:last-child{border:0}
    .buttons button.on{background:#dfd6c4;color:#20221f;font-weight:bold}
    .buttons button:hover:not(.on){background:rgba(255,255,255,.06)}
    .panel-btn{border:0;padding:9px;color:#fff;font-size:12px;cursor:pointer;border-radius:2px;transition:opacity .15s}
    .panel-btn:hover{opacity:.85}
    .panel-btn.brown{background:#79533c}
    .panel-btn.dark{background:#3a3c38}
    .panel-btn.red{background:var(--red)}

    /* 颜色/字号控件 */
    .color-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
    .color-row input[type=color]{width:30px;height:26px;border:1px solid #555850;border-radius:2px;background:#2d2f2c;cursor:pointer;padding:1px}
    .preset-row{display:flex;gap:5px;flex-wrap:wrap}
    .preset{width:22px;height:22px;border-radius:50%;border:2px solid #555850;cursor:pointer;transition:transform .15s}
    .preset:hover{transform:scale(1.15)}
    .preset.on{border-color:#d5b96f;box-shadow:0 0 0 2px rgba(213,185,111,.3)}
    .range-row{display:flex;align-items:center;gap:8px}
    .range-row input[type=range]{flex:1;accent-color:#d5b96f}
    .range-row span{font-size:11px;color:#c0baae;min-width:32px;text-align:right}

    /* ===== 工作区 ===== */
    .work{overflow:auto;flex:1;position:relative}
    .bar{height:50px;background:#e7e4da;border-bottom:1px solid #c4c0b7;display:flex;align-items:center;padding:0 26px;padding-bottom:env(safe-area-inset-bottom);gap:10px;font-size:13px;font-weight:bold;position:sticky;top:0;z-index:10}
    .bar button{border:0;padding:8px 13px;background:#272925;color:#fff;font-size:12px;cursor:pointer;border-radius:2px;transition:background .15s}
    .bar button:hover{background:#3a3c38}
    .bar button+button{background:#79533c}
    .bar button+button:hover{background:#8d6248}
    .bar .spacer{flex:1}
    /* v18：横杠按钮 — 用中性深色避免被 +button 棕色调覆盖 */
    .bar button.hr-btn{background:#3a3c38;letter-spacing:.5px;display:inline-flex;align-items:center;gap:5px}
    .bar button.hr-btn:hover{background:#4a4c48}
    .bar button.hr-btn::before{content:"";display:inline-block;width:18px;border-top:1.5px solid #d5b96f;margin:0 2px}

    /* ===== 报纸版式 ===== */
    .paper{position:relative;width:min(980px,calc(100% - 64px));margin:38px auto;background:var(--paper);padding:34px 46px 130px;box-shadow:0 8px 26px rgba(0,0,0,.25)}
    .water{position:absolute;right:18px;bottom:14px;z-index:2;pointer-events:none;color:#111;opacity:.3;letter-spacing:4px;font:bold 15px Georgia}
    .mast{display:flex;justify-content:space-between;align-items:end;font:10px Georgia;letter-spacing:1px;gap:8px}
    .mast b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .mast b{font-size:31px;letter-spacing:-1.8px}
    .rule{border-top:3px solid;border-bottom:1px solid;height:5px;margin:10px 0 18px}
    .kicker{font:bold 11px Arial;color:var(--red);letter-spacing:1.2px}
    .paper h1{font:clamp(38px,5vw,64px)/1 Georgia,serif;letter-spacing:-2.6px;margin:14px 0}
    .deck{font:18px/1.42 Georgia;max-width:720px}
    .by{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px 0;font-size:11px;color:#615c54}
    .hero{width:min(100%,310px);aspect-ratio:3/4;margin:25px auto;background:#dfdbd0;border:1px solid #aaa394;display:grid;place-items:center;text-align:center;overflow:hidden;cursor:pointer;transition:border-color .15s;position:relative}
    .hero:hover{border-color:var(--red)}
    .hero img{width:100%;height:100%;object-fit:cover}
    .hero b{font:16px Georgia}
    .hero small{font-size:11px;color:#888}
    /* 图片删除按钮 */
    .hero-del{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.58);color:#fff;border:0;font-size:16px;line-height:1;cursor:pointer;z-index:3;display:flex;align-items:center;justify-content:center;padding:0;transition:background .15s}
    .hero-del:hover{background:rgba(0,0,0,.85)}
    /* 无图时的紧凑占位（不占大空白，导出/打印时隐藏） */
    .hero.empty{aspect-ratio:auto;height:64px;margin:12px auto;background:transparent;border:1px dashed #aaa394;display:flex;align-items:center;justify-content:center;color:#888;font:13px Georgia;letter-spacing:.5px;cursor:pointer;padding:0 10px}
    .hero.empty:hover{color:var(--red);border-color:var(--red)}
    .hero.empty .hero-empty{display:flex;align-items:center;gap:8px}
    /* 空段落 / 空块不占位：删除内容后自动向上补位（聚焦时保留以便继续输入） */
    .cols p[data-edit="articleP"]:empty:not(:focus),
    .story .edit p:empty:not(:focus),
    .sp-writer p:empty:not(:focus){display:none}
    .cols{column-gap:34px;column-rule:1px solid #d0cabd;font:var(--body-size)/1.65 Georgia,"PingFang SC",serif;text-align:justify}
    .cols p{break-inside:avoid;margin-top:0;margin-bottom:1em}
    .edit{outline:0;cursor:text;border:1px dashed transparent;transition:border-color .15s}
    .edit:focus{border-color:var(--red);background:#fffdf7}

    /* ===== v18：水平横杠（分隔线） =====
       横贯三个板块（新闻 / 写文章 / 写副业）的统一分隔线。
       新闻板块需在多栏内优雅断行；写文章 / 写副业是单栏全宽。
       用 margin + 纯色细线保证不会被 columns 切碎。 */
    .hr-md{
      display:block !important;
      width:100%;
      height:0;
      border:0;
      border-top:1.5px solid var(--ink);
      margin:1.4em 0;
      background:transparent;
      column-span:all;
      -webkit-column-break-inside:avoid;
      page-break-inside:avoid;
      break-inside:avoid;
      cursor:default;
      outline:0;
      position:relative;
    }
    /* hover 时提示"这是一个分割线" */
    .hr-md:hover{border-top-color:var(--red)}
    /* 副业卡片背景偏白，让横杠更醒目 */
    .sp-writer .hr-md{border-top-width:1.5px;border-top-color:#111}
    /* 写文章卡片间距大一些 */
    .story .edit .hr-md{margin:1.6em 0}
    /* 让横杠在多栏排版里完整显示，不被截到下一栏 */
    .cols .hr-md{-webkit-column-break-after:avoid;column-break-after:avoid}
    /* 不要给 hr 加 contenteditable 边框 */
    .hr-md.edit{border-top-style:solid}

    /* ===== 副业版（黑白调 · 参考 WSJ Markets 顶部黑带 + 写文章双栏格局） ===== */
    .sp-shell{position:relative;width:min(700px,calc(100% - 40px));margin:40px auto 40px;background:#fff;display:grid;grid-template-rows:auto 1fr;box-shadow:0 8px 26px rgba(0,0,0,.25);color:#111;overflow:hidden}
    .sp-mast-band{background:#000;color:#fff;padding:13px 26px;display:flex;align-items:center;gap:14px;font:bold 13px Arial;letter-spacing:2px;flex-wrap:wrap}
    .sp-mast-edit{display:inline-block;padding:2px 4px;border-radius:0;outline:0;transition:background .12s}
    .sp-mast-edit:focus{outline:0;box-shadow:inset 0 -1.5px 0 0 #fff}
    .sp-mast-band .sp-mark{font:bold 16px Georgia;letter-spacing:0}
    .sp-mast-band .sp-divider{color:#666;font-weight:normal}
    .sp-mast-band .meta{margin-left:auto;font:11px Arial;letter-spacing:1.2px;color:#bdbdbd;font-weight:normal}

    .sp-body{display:flex;flex-direction:column;padding:26px 28px 130px;min-width:0;gap:20px}
    .sp-header{display:flex;flex-direction:column}
    .sp-image-block{display:flex;justify-content:center;align-items:center;width:100%}
    .sp-image-block .hero{margin:0 auto;width:100%;max-width:520px}
    .sp-tag-edit{font:bold 11px Arial;color:#000;letter-spacing:1.6px;display:block;margin-bottom:10px;outline:0;padding:2px 0;transition:background .12s}
    .sp-tag-edit:focus{outline:0;box-shadow:inset 0 -1.5px 0 0 #000}
    .sp-title-edit{
      font:bold 40px/1.0 Georgia,"PingFang SC",serif;
      color:#fff;background:#000;
      letter-spacing:-1.5px;margin:4px 0 18px;outline:0;
      display:inline-block;padding:14px 22px 12px;
      border:0;border-radius:0;
      box-sizing:border-box;max-width:100%;
      word-break:break-word;
      box-shadow:0 2px 0 0 #000;
    }
    .sp-title-edit:focus{outline:0;background:#000;color:#fff;box-shadow:0 3px 0 0 #000}
    .sp-title-edit:empty::before{content:attr(data-placeholder);color:rgba(255,255,255,.5);font-style:italic}
    .sp-title-edit{outline:0;display:inline-block;padding:14px 22px;background:#000;color:#fff;font:bold 24px/1 "PingFang SC","Noto Serif SC",serif;letter-spacing:1px;box-shadow:0 2px 0 0 #000;cursor:text;max-width:100%;box-sizing:border-box;position:relative}

    .sp-content-col{display:flex;flex-direction:column;padding-left:22px;min-width:0}
    .sp-writer{
      font:var(--body-size)/1.85 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
      color:#1a1a1a;
      min-height:360px;
      outline:0;
      padding:18px 4px;
      letter-spacing:.2px;
      cursor:text;
    }
    .sp-writer p{margin:0 0 16px;line-height:1.85}
    .sp-writer p:last-child{margin-bottom:0}
    .sp-writer:empty::before{content:attr(data-placeholder);color:#b0b0b0;font-style:italic}
    .sp-writer:focus{outline:0}
    .sp-list{display:flex;flex-direction:column}
    .sp-item{padding:16px 0;border-bottom:1px solid #e2e2e2;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;transition:background .15s;cursor:text}
    .sp-item:first-child{padding-top:6px}
    .sp-item:last-child{border-bottom:0}
    .sp-item:hover{background:#fafafa}
    .sp-item .date{font:bold 11px Arial;color:#000;letter-spacing:.6px;padding-top:4px;min-width:62px;text-transform:uppercase;outline:0;transition:background .12s}.sp-item .date.editable:focus{background:#fff8e1;box-shadow:inset 0 -1.5px 0 0 #000}
    .sp-item .body{min-width:0}
    .sp-item .title{font:18px/1.3 Georgia,"PingFang SC",serif;color:#000;letter-spacing:-.3px;font-weight:500}
    .sp-item .title:empty::before{content:attr(data-placeholder);color:#bbb;font-style:italic;font-weight:normal}
    .sp-item .preview{font:13px/1.5 Georgia,"PingFang SC",serif;color:#555;margin-top:5px}
    .sp-item .preview:empty::before{content:attr(data-placeholder);color:#ccc;font-style:italic}
    .sp-item .key{display:flex;align-items:center;gap:2px;padding-top:6px;flex-shrink:0}
    .sp-item .delete-btn{background:none;border:0;color:#aaa;cursor:pointer;font-size:18px;padding:0 6px;border-radius:2px;line-height:1}
    .sp-item .delete-btn:hover{background:#f0f0f0;color:#000}
    .sp-item .editable[contenteditable="true"]{transition:background .12s}
    .sp-item .editable[contenteditable="true"]:focus{background:#fff;outline:0;box-shadow:inset 0 -2px 0 0 #000}
    .sp-empty{padding:48px 0;text-align:center;color:#999;font:13px Georgia;letter-spacing:1px}

    /* 副业表单 */
    .sp-form-row{display:grid;grid-template-columns:120px 1fr;gap:8px;align-items:center}
    .sp-form-row label{font-size:11px;letter-spacing:1.3px;color:#c0baae}
    .entries-existing{border-top:1px solid #555850;margin-top:8px;padding-top:8px}
    .entry-row{display:flex;gap:6px;align-items:center;padding:6px;background:#2d2f2c;border-radius:2px;margin-bottom:5px;font-size:11px;color:#aaa}
    .entry-row b{flex:1;color:#fff;font-weight:normal;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .entry-row .entry-actions{display:flex;gap:4px;flex-shrink:0}
    .entry-row button{background:none;border:0;color:#d5b96f;cursor:pointer;font-size:11px;padding:2px 6px;border-radius:2px}
    .entry-row button:hover{background:#3a3c38}
    .entry-row button.del{color:#f88}
    .add-btn{background:var(--red);color:#fff;border:0;padding:8px;cursor:pointer;border-radius:2px;font-size:12px;margin-top:6px;width:100%;letter-spacing:1.2px}
    .add-btn:hover{opacity:.88}

    /* ===== 写文章 ===== */
    .story{position:relative;width:min(700px,calc(100% - 40px));margin:40px auto 40px;padding:28px 28px 130px;background:var(--paper);display:grid;grid-template-columns:3fr 4fr;gap:25px;box-shadow:0 8px 26px rgba(0,0,0,.25)}
    .story .hero{width:100%;margin:0}
    .story h1{font:38px/1 Georgia;margin:10px 0 18px}
    .story p{font:var(--body-size)/1.65 Georgia,"PingFang SC",serif;margin:0 0 1em}
    .story small.tag{color:var(--red);letter-spacing:1px;font-size:12px;font-weight:bold;font-family:Arial}

    /* ===== 暗戳（圆形实图）— 居中 · 清晰 · 无 blur ===== */
    .stamp-wrap{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);width:140px;height:140px;z-index:5;pointer-events:none;display:block}
    .stamp-wrap svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 0 1.5px rgba(58,30,12,.35))}
    .stamp-ring-outer{fill:none;stroke:#3a1f12;stroke-width:1.1;opacity:.78;stroke-dasharray:2.6 1.6}
    .stamp-ring{fill:none;stroke:#2b1408;stroke-width:2.2;opacity:.92}
    .stamp-ring-inner{fill:none;stroke:#3a1f12;stroke-width:.9;opacity:.78;stroke-dasharray:.7 1.5}
    .stamp-text{font:bold 8.4px Georgia;fill:#1f0e05;letter-spacing:5.5px;opacity:.92}
    .stamp-text-bottom{font:bold 8.2px Georgia;fill:#1f0e05;letter-spacing:5px;opacity:.92}
    .stamp-center-fill{fill:#000;opacity:.05}
    .sp-shell .stamp-wrap{bottom:28px}

    /* ===== 全局可编辑提示（v9） ===== */
    .edit[contenteditable="true"]{
      -webkit-user-select:text !important;
      user-select:text !important;
      -webkit-tap-highlight-color:transparent;
      cursor:text;
      transition:background .12s,box-shadow .12s;
      border-radius:1px;
    }
    .edit[contenteditable="true"]:focus,
    .edit[contenteditable="true"]:active{
      outline:0 !important;
      -webkit-tap-highlight-color:transparent !important;
      background:rgba(255,235,150,.35) !important;
      box-shadow:inset 0 -2px 0 0 rgba(0,0,0,.85);
    }
    .edit[contenteditable="true"]:hover:not(:focus){
      background:rgba(0,0,0,.04);
    }
    .sp-title-edit:focus,.sp-title-edit:active{
      background:#000 !important;
      color:#fff !important;
      box-shadow:0 3px 0 0 #000 !important;
    }
    /* ===== Toast ===== */
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--dark);color:#f7f3e9;padding:12px 24px;border-radius:4px;font-size:14px;z-index:9999;opacity:0;transition:all .3s;pointer-events:none}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    /* ===== 浮动横杠按钮（跟随屏幕，写到哪都能点） ===== */
    .float-hr{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:100;width:48px;height:48px;border-radius:50%;background:var(--dark);color:#d5b96f;border:1.5px solid #4a4c48;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.35);transition:opacity .25s,transform .15s;user-select:none;-webkit-tap-highlight-color:transparent}
    .float-hr:hover{background:#3a3c38;transform:scale(1.06)}
    .float-hr:active{transform:scale(.93)}
    .float-hr::before{content:"";display:block;width:22px;border-top:2px solid #d5b96f}
    .float-hr::after{content:"插入横杠";position:absolute;right:56px;top:50%;transform:translateY(-50%);background:var(--dark);color:#d5b96f;padding:4px 10px;border-radius:4px;font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
    .float-hr:hover::after{opacity:.9}
    .float-hr.hide{opacity:0;pointer-events:none;transform:scale(.7)}
    @media print{.float-hr{display:none!important}}

    /* ===== 手机端（修复一） ===== */
    @media(max-width:768px){
      body{font-size:15px;-webkit-text-size-adjust:100%}
      .nav{padding:0 10px;padding-top:env(safe-area-inset-top);gap:6px;height:calc(52px + env(safe-area-inset-top))}
      .mark{padding:0 6px;font-size:18px}
      .brand{display:none}
      .tabs{gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch}
      .tabs button{padding:0 12px;font-size:14px;min-width:0;flex-shrink:0;min-height:44px}
      .undo-btn{padding:8px 12px;font-size:12px;min-height:44px}
      .panel-toggle{display:flex;align-items:center;justify-content:center;width:40px;height:40px;background:transparent;border:1px solid #555850;color:#ddd6c8;border-radius:4px;cursor:pointer;margin-right:6px;-webkit-tap-highlight-color:transparent}
      .panel-toggle svg{width:20px;height:20px;display:block}

      .panel{padding:12px 14px;max-height:65vh;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;transition:max-height .3s ease}
      .panel.collapsed{max-height:0;padding:0 14px;border-bottom:0;overflow:hidden}
      .panel-section{min-width:100%;border-right:0;border-bottom:1px solid #555850;padding:12px 0}
      .panel-section:last-child{border-bottom:0}
      .panel-section b{font-size:14px}
      .label{font-size:12px;gap:6px}
      .label input,.label textarea,.label select{font-size:16px !important;padding:10px 12px;border-radius:4px}
      .label textarea{height:80px;font-size:16px !important;line-height:1.5}
      .note{font-size:12px}

      .buttons button{padding:10px 6px;font-size:13px;min-height:44px}
      .panel-btn{padding:12px;font-size:13px;min-height:44px}
      .preset{width:32px;height:32px}
      .color-row input[type=color]{width:40px;height:36px}
      .add-btn{padding:12px;font-size:14px;min-height:44px}
      .entry-row button{padding:6px 10px;font-size:13px}

      .bar{padding:0 10px;padding-bottom:env(safe-area-inset-bottom);height:calc(48px + env(safe-area-inset-bottom));gap:6px}
      .bar button{padding:10px 14px;font-size:13px;min-height:44px;border-radius:4px}
      .bar>span{font-size:12px;max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .work{padding-bottom:calc(80px + env(safe-area-inset-bottom))}

      .paper{width:calc(100% - 12px);margin:8px auto;padding:16px 14px 130px;border-radius:2px}
      .water{right:10px;bottom:8px;font-size:10px;letter-spacing:2px;opacity:.2}
      .mast{font-size:10px;gap:6px;flex-wrap:nowrap}
      .mast b{font-size:20px;letter-spacing:-1px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .paper h1{font-size:32px;letter-spacing:-1.5px}
      .deck{font-size:15px}
      .cols{columns:1 !important;font-size:var(--body-size);line-height:1.7}
      .cols p{margin-bottom:1.1em}
      .edit{padding:4px;border-radius:2px}
      .edit:focus{border:1px dashed var(--red);border-radius:2px}
      .hero{max-width:220px;margin:14px auto;width:100%;border-radius:2px}
      .hero.empty{height:56px;margin:10px auto;font-size:12px}
      .hero b{font-size:14px}
      .hero small{font-size:11px}
      .by{font-size:12px;padding:8px 0}
      .kicker{font-size:12px}

      .story{grid-template-columns:1fr;padding:20px 16px 130px;margin:12px auto;width:calc(100% - 12px);border-radius:2px}
      .story .hero{max-width:240px;margin:auto}
      .story h1{font-size:26px}
      .story p{font-size:var(--body-size);line-height:1.7}
      .story small.tag{font-size:13px}

      .sp-shell{width:100%;margin:0;border-radius:0;box-shadow:none}
      .sp-mast-band{padding:12px 16px;font-size:12px;gap:8px;padding-top:calc(12px + env(safe-area-inset-top))}
      .sp-mast-band .sp-mark{font-size:15px}
      .sp-mast-band .meta{display:none}
      .sp-body{grid-template-columns:1fr;padding:20px 16px 130px;gap:18px}
      .sp-image-block .hero{max-width:100%}
      .sp-writer{min-height:240px;font-size:var(--body-size)}
      .sp-title-edit{font-size:26px}
      .sp-tag-edit{font-size:12px}
      .sp-title-edit{font-size:18px;padding:12px 18px}
      .sp-item{padding:14px 0;gap:10px;min-height:44px}
      .sp-item .date{font-size:11px;min-width:50px}
      .sp-item .title{font-size:16px}
      .sp-item .preview{font-size:13px}
      .sp-item .delete-btn{font-size:20px;padding:8px;min-width:36px;min-height:36px}
      .sp-empty{padding:32px 0}
      .sp-form-row{grid-template-columns:1fr;gap:6px}

      .stamp-wrap{width:88px;height:88px;bottom:16px}
      .stamp-text{font-size:6.8px;letter-spacing:3.5px}
      .stamp-text-bottom{font-size:6.6px;letter-spacing:3px}

      .toast{bottom:calc(24px + env(safe-area-inset-bottom));font-size:15px;padding:14px 28px;max-width:90vw}
    }

    @media(max-width:768px) and (display-mode:standalone){
      .nav{padding-top:env(safe-area-inset-top)}
      body{overscroll-behavior-y:none}
    }

    @media print{
      .nav,.panel,.bar{display:none !important}
      .tool{display:block}
      .paper,.story{box-shadow:none;width:100%;margin:0;padding:24px}
      .sp-shell{box-shadow:none;width:100%;margin:0}
      .edit,.editable[contenteditable="true"]{border-color:transparent !important;background:transparent !important;box-shadow:none !important;outline:none !important}
      .hero.empty{display:none !important}
      .hero-del{display:none !important}
    }

    /* 滚动条美化 */
    .panel::-webkit-scrollbar,.work::-webkit-scrollbar,.sp-tabs::-webkit-scrollbar,.tabs::-webkit-scrollbar{height:6px;width:6px}
    .panel::-webkit-scrollbar-thumb,.work::-webkit-scrollbar-thumb,.sp-tabs::-webkit-scrollbar-thumb,.tabs::-webkit-scrollbar-thumb{background:#888;border-radius:3px}
  </style>

<!-- Service Worker 已彻底移除，避免缓存导致页面跳动/无限刷新 -->
<script>
// 一次性清理旧版 Service Worker（不注册新的，不刷新页面）
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(regs) {
    regs.forEach(function(r) { r.unregister(); });
  });
  if ('caches' in window) {
    caches.keys().then(function(names) {
      names.forEach(function(n) { caches.delete(n); });
    });
  }
}
</script>

            var db = e.target.result;
            if (!db.objectStoreNames.contains(DB_STORE)) {
              db.createObjectStore(DB_STORE);
            }
          };
          req.onsuccess = function(e) { resolve(e.target.result); };
          req.onerror = function(e) { reject(e); };
        } catch(e) { reject(e); }
      });
    }

    function idbSave(data) {
      return idbOpen().then(function(db) {
        return new Promise(function(resolve, reject) {
          try {
            var tx = db.transaction(DB_STORE, 'readwrite');
            tx.objectStore(DB_STORE).put(data, 'current');
            tx.oncomplete = function() { resolve(true); };
            tx.onerror = function(e) { reject(e); };
          } catch(e) { reject(e); }
        });
      }).catch(function() { return false; });
    }

    function idbLoad() {
      return idbOpen().then(function(db) {
        return new Promise(function(resolve, reject) {
          try {
            var tx = db.transaction(DB_STORE, 'readonly');
            var req = tx.objectStore(DB_STORE).get('current');
            req.onsuccess = function(e) { resolve(e.target.result); };
            req.onerror = function(e) { reject(e); };
          } catch(e) { reject(e); }
        });
      }).catch(function() { return null; });
    }

        state = prev;
        applyTheme();

    const esc = s => String(s == null ? '' : s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));

    /* ============================================================
       v16 新增：内容安全工具函数
       ------------------------------------------------------------
       1) extractParagraphs(el)：遍历 DOM，把 <p>/<div>/<br> 等块级边界
          统一解析成段落数组。不再依赖 querySelectorAll('p')，
          因此粘贴产生的 <div> 块、手动换行的 <br> 都能被正确捕获，
          这是修复「导出长图后文章被清空」的关键。
       2) cleanPastedText(text)：粘贴文本清洗 —— 多余空行 / 连续空白 /
          全角空格 / 异常换行 / 无用字符，全部整理成规整段落。
       3) insertCleanParagraphs(container, text)：把清洗后的文本按段落
          插入可编辑区，统一生成 <p> 结构。
       4) pruneEmptyBlocks(container)：删除空段落 / 空 div，避免
          「删除内容后留下巨大空白」。
       ============================================================ */
    const BLOCK_TAGS = ['P','DIV','SECTION','ARTICLE','LI','BLOCKQUOTE','H1','H2','H3','H4','H5','H6','TABLE','TR','TD','TH','UL','OL','FIGURE','FIGCAPTION'];

    function extractParagraphs(el) {
      if (!el) return [];
      const blocks = [];
      let buf = '';
      const flush = () => {
        const t = buf.replace(/\u00a0/g, ' ').trim();
        if (t) blocks.push(t);
        buf = '';
      };
      const walk = (node) => {
        if (node.nodeType === 3) { buf += node.nodeValue; }
        else if (node.nodeType === 1) {
          const tag = node.tagName;
          if (tag === 'BR') { flush(); }
          else if (tag === 'HR') {
            // 横杠节点：作为独立段标记，flush 当前缓冲再压入 ---
            flush();
            blocks.push('---');
          }
          else if (tag === 'IMG') {
            // 保留图片占位文本，避免内嵌图片被静默丢弃
            buf += ' [图片] ';
          }
          else if (BLOCK_TAGS.indexOf(tag) !== -1) {
            flush();
            node.childNodes.forEach(walk);
            flush();
          } else {
            node.childNodes.forEach(walk);
          }
        }
      };
      walk(el);
      flush();
      return blocks;
    }

    function cleanPastedText(text) {
      return String(text == null ? '' : text)
        .replace(/\r\n?/g, '\n')                     // 统一换行
        .replace(/[\u200b\u200c\u200d\ufeff]/g, '')   // 去掉零宽字符/BOM
        .replace(/[ \t\u00a0\u3000]{2,}/g, ' ')       // 连续空格/制表/全角空格 → 1 个空格
        .replace(/\n{3,}/g, '\n\n')                   // 3+ 空行 → 1 个空行
        .split('\n')
        .map(l => l.replace(/^[ \t\u3000\u00a0]+|[ \t\u3000\u00a0]+$/g, '')) // 每行去首尾空白
        .join('\n')
        .replace(/\n{3,}/g, '\n\n');
    }

    function paragraphsFromText(text) {
      // 清洗后按空行切段；段内单个换行 → 空格（中日韩之间不留空格）
      return cleanPastedText(text)
        .split(/\n{2,}/)
        .map(p => p.split('\n').join(' '))
        .map(p => p.replace(/([\u4e00-\u9fff])\s+([\u4e00-\u9fff])/g, '$1$2').trim())
        .filter(Boolean);
    }

    function insertCleanParagraphs(container, text) {
      // v18：支持 --- 横杠段（识别后插入带 .hr-md class 的 <hr> 节点）
      const paras = paragraphsFromText(text);
      if (!paras.length) return;
      const blocks = blocksFromParagraphs(paras);
      if (!blocks.length) return;
      const make = (b) => {
        if (b.hr) {
          const h = document.createElement('hr');
          h.className = 'hr-md';
          return h;
        }
        const p = document.createElement('p');
        p.textContent = b.p || '';
        return p;
      };
      const sel = window.getSelection();
      if (sel && sel.rangeCount && sel.getRangeAt(0).intersectsNode(container)) {
        const range = sel.getRangeAt(0);
        let anchor = range.startContainer;
        if (anchor.nodeType === 3) anchor = anchor.parentElement;
        // 找到光标所在的块级元素，把新段落插到该块「之后」，
        // 避免把 <p> 嵌套进 <p> 破坏结构
        let block = anchor;
        while (block && block !== container && BLOCK_TAGS.indexOf(block.tagName) === -1) block = block.parentElement;
        const lastNode = make(blocks[blocks.length - 1]);
        const frag = document.createDocumentFragment();
        blocks.forEach((b, i) => { frag.appendChild(i === blocks.length - 1 ? lastNode : make(b)); });
        if (block && block !== container) block.after(frag);
        else container.appendChild(frag);
        const r = document.createRange();
        r.setStartAfter(lastNode);
        r.collapse(true);
        sel.removeAllRanges();
        sel.addRange(r);
      } else {
        const frag = document.createDocumentFragment();
        blocks.forEach(b => frag.appendChild(make(b)));
        container.appendChild(frag);
      }
    }

    function pruneEmptyBlocks(container) {
      if (!container) return;
      container.querySelectorAll('p,div').forEach(function(b) {
        if (b === container) return;
        if (b.children.length === 0 && !b.textContent.trim()) b.remove();
      });
    }

    /* ============================================================
       v18 新增：水平横杠（分隔线）支持
       ------------------------------------------------------------
       1) isHrLine(s)：判断一段字符串是否是一条"独立的横杠行"
          （整行由 - = * _ 三连及以上字符组成）。
       2) blocksFromParagraphs(paras)：把段落数组转换为块数组，
          把横杠段识别为 {hr:true}，普通段仍是 {p:'...'}。
       3) renderBlocksHtml(blocks, opts)：把块数组渲染为 <p> 与
          <hr class="hr-md"> 混排的 HTML 字符串，opts 控制是否
          contenteditable。
       4) extractHrInContainer(el)：收集 .edit 容器内的 hr 节点并
          转回 "---" 字符串段；让 state.* 文本里保留可识别的横杠段。
       5) insertBlocksMix(container, blocks, opts)：在
          contenteditable 里按块类型插入（段落 / 横杠）。
       ============================================================ */
    const HR_LINE_RE = /^[ \t]*([-=*_─—–]{3,})[ \t]*$/;
    function isHrLine(s) {
      if (typeof s !== 'string') return false;
      const t = s.replace(/[ \t\u3000]/g, '').trim();
      if (t.length < 3) return false;
      // 只识别由同一种横线字符（- * _ ─ — –）组成的整行
      // 避免把 markdown 的 ===（二级标题）等误识别成横杠
      return /^([-*_─—–])\1{2,}$/.test(t);
    }

    function blocksFromParagraphs(paras) {
      return (paras || []).map(p => isHrLine(p) ? { hr: true, raw: p } : { p });
    }

    function renderBlocksHtml(blocks, opts) {
      opts = opts || {};
      return (blocks || []).map(b => {
        if (b.hr) return `<hr class="hr-md" data-hr="1">`;
        if (opts.contenteditable) {
          const de = opts.dataEdit || '';
          return `<p class="edit" contenteditable="true" data-edit="${de}">${esc(b.p)}</p>`;
        }
        return `<p>${esc(b.p)}</p>`;
      }).join('');
    }

    // 把 contenteditable 容器里的内容解析为"字符串段（含 --- 横杠段）"
    // 用于把 DOM 回写回 state.article / state.writerText 等纯文本字段。
    function serializeContent(el) {
      if (!el) return '';
      const out = [];
      const walk = (node) => {
        if (node.nodeType === 3) { out.push(node.nodeValue); }
        else if (node.nodeType === 1) {
          const tag = node.tagName;
          if (tag === 'HR') {
            out.push('\n\n---\n\n');
          } else if (tag === 'BR') {
            // 普通 <br> 在序列化时当作段落分隔
            out.push('\n\n');
          } else if (BLOCK_TAGS.indexOf(tag) !== -1) {
            out.push('\n\n');
            node.childNodes.forEach(walk);
            out.push('\n\n');
          } else {
            node.childNodes.forEach(walk);
          }
        }
      };
      walk(el);
      // 折叠多余空行
      return out.join('').replace(/\n{3,}/g, '\n\n').replace(/^\n+|\n+$/g, '');
    }

    // 将 content 中的所有 <hr> 回写为段落形式（用于 export 渲染）
    function htmlForExport(el) {
      if (!el) return '';
      return el.innerHTML;
    }

    function insertBlocksMix(container, blocks, opts) {
      if (!container || !blocks || !blocks.length) return;
      opts = opts || {};
      const sel = window.getSelection();
      const make = (b) => {
        if (b.hr) return document.createElement('hr');
        const p = document.createElement('p');
        p.textContent = b.p || '';
        if (opts.contenteditable) {
          p.className = 'edit';
          p.contentEditable = 'true';
          if (opts.dataEdit) p.dataset.edit = opts.dataEdit;
        }
        return p;
      };
      if (sel && sel.rangeCount && sel.getRangeAt(0).intersectsNode(container)) {
        const range = sel.getRangeAt(0);
        let anchor = range.startContainer;
        if (anchor.nodeType === 3) anchor = anchor.parentElement;
        let block = anchor;
        while (block && block !== container && BLOCK_TAGS.indexOf(block.tagName) === -1) block = block.parentElement;
        const nodes = blocks.map(make);
        const frag = document.createDocumentFragment();
        nodes.forEach(n => frag.appendChild(n));
        if (block && block !== container) block.after(frag);
        else container.appendChild(frag);
        const r = document.createRange();
        const last = nodes[nodes.length - 1];
        r.setStartAfter(last);
        r.collapse(true);
        sel.removeAllRanges();
        sel.addRange(r);
      } else {
        const frag = document.createDocumentFragment();
        blocks.forEach(b => frag.appendChild(make(b)));
        container.appendChild(frag);
      }
    }

    // ---- 导出前：把所有 contentEditable 内容同步回 state ----
    function syncAllToState() {

    // ---- 高保真长图导出（懒加载 html2canvas，v16 起多源回退）----
    let _h2cLoaded = false, _h2cLoading = false;
    const H2C_SOURCES = [
      'html2canvas.min.js',   // ① 站内同源副本（v16 随站点一起部署，国内访问最快最稳）
      'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
      'https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js',
      'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js'
    ];
    function loadH2C(cb) {
      if (typeof html2canvas !== 'undefined') { _h2cLoaded = true; cb(); return; }
      if (_h2cLoading) return;
      _h2cLoading = true;
      showToast('正在加载导出组件…');
      let i = 0, timer = null;
      const tryNext = () => {
        if (timer) { clearTimeout(timer); timer = null; }
        if (i >= H2C_SOURCES.length) {
          _h2cLoading = false;
          showToast('导出组件加载失败，请检查网络后重试');
          return;
        }
        const src = H2C_SOURCES[i++];
        const s = document.createElement('script');
        let done = false;
        s.src = src;
        s.onload = function() {
          if (done) return;
          if (typeof html2canvas !== 'undefined') {
            done = true;
            _h2cLoaded = true; _h2cLoading = false;
            cb();
          } else { tryNext(); }
        };
        s.onerror = function() { if (!done) tryNext(); };
        document.head.appendChild(s);
        // 兜底：8 秒仍未就绪则换下一个源（某些环境下脚本不执行）
        timer = setTimeout(function() {
          if (!done && typeof html2canvas === 'undefined') {
            try { s.remove(); } catch(e) {}
            tryNext();
          }
        }, 8000);
      };
      tryNext();
    }

    function downloadLong(id, fileLabel) {
      loadH2C(function() {
      // v16 修复：导出「只读」当前 DOM，绝不重建页面。
      // 旧逻辑在这里执行 syncAllToState()+render()，render() 会用
      // app.innerHTML 整页重建 DOM —— 一旦 state 同步有遗漏（例如粘贴
      // 产生 <div> 而同步函数只认 <p>），正文就会被重建为空，长图空白。
      // 现在：内容已经在页面上了，直接截图即可；syncAllToState() 仅
      // 用于把当前内容持久化，不触碰 DOM。
      syncAllToState();
      const node = document.getElementById(id);
      if (!node) return;
      showToast('正在生成长图…');
      const edits = node.querySelectorAll('.edit,.editable[contenteditable="true"]');
      const restore = [];
      edits.forEach(e => {
        restore.push({e, c: e.style.borderColor, b: e.style.background, s: e.style.boxShadow});
        e.style.borderColor = 'transparent';
        e.style.outline = 'none';
        e.style.background = 'transparent';
        e.style.boxShadow = 'none';
      });
      // 截图期间隐藏：空占位图 / 图片删除按钮（不改变 state，截完恢复）
      const empties = node.querySelectorAll('.hero.empty, .hero-del');
      empties.forEach(el => { el.dataset.prevDisplay = el.style.display || ''; el.style.display = 'none'; });
      html2canvas(node, {
        scale: 2,
        useCORS: true,
        backgroundColor: state.paper || '#fff',
        logging: false,
        scrollX: 0, scrollY: 0,
        windowWidth: node.scrollWidth,
        windowHeight: node.scrollHeight
      }).then(canvas => {
        restore.forEach(o => { o.e.style.borderColor = o.c; o.e.style.background = o.b; o.e.style.boxShadow = o.s; });
        empties.forEach(el => { el.style.display = el.dataset.prevDisplay; delete el.dataset.prevDisplay; });
        canvas.toBlob(blob => {
          const title = (node.querySelector('h1') || {}).textContent || '无墙之门';
          const file = new File([blob], '无墙之门-' + (fileLabel || title.slice(0,20)) + '.png', {type:'image/png'});
          if (navigator.canShare && navigator.canShare({files:[file]})) {
            navigator.share({files:[file], title:'无墙之长图'}).catch(()=>{});
          } else {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = file.name;
            a.click();
            setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
          }
          showToast('长图已导出');
        }, 'image/png');
      }).catch(err => {
        restore.forEach(o => { o.e.style.borderColor = o.c; o.e.style.background = o.b; o.e.style.boxShadow = o.s; });
        empties.forEach(el => { el.style.display = el.dataset.prevDisplay; delete el.dataset.prevDisplay; });
        showToast('导出失败：' + err.message);
      });
      });
    }

    /* ============================================================
       v18 新增：在三个板块的正文光标处插入水平横杠（<hr> 节点）
       - news 板块：光标落在 .cols 内 → 插入 <hr> 到 cols 子节点末尾
       - writer 板块：光标落在 writerBody 内 → 同样插入
       - side 板块：直接 append 到 #sideWriter 末尾
       优先尝试当前选区（如果是 contenteditable 容器内），否则
       把 <hr> 追加到目标容器末尾。
       ============================================================ */
    window.insertHr = function(scope) {
      const hr = document.createElement('hr');
      hr.className = 'hr-md';

      let target = null;
      // 不同板块对应的 contenteditable 容器
      if (scope === 'news') {
        // 找到第一个 .cols 中的 .edit 容器
        target = document.querySelector('.cols');
      } else if (scope === 'writer') {
        target = document.querySelector('.story div.edit[contenteditable][data-edit="writerBody"]');
      } else if (scope === 'side') {
        target = document.getElementById('sideWriter');
      }

      if (!target) {
        showToast('请先把光标放在正文里');
        return;
      }

      pushHistory();

      const sel = window.getSelection();
      let inserted = false;
      if (sel && sel.rangeCount) {
        const range = sel.getRangeAt(0);
        // 要求光标在 target 内或其后代里
        if (target.contains(range.commonAncestorContainer) || target === range.commonAncestorContainer) {
          // 找到光标所在的块级元素，避免横杠塞进 <p> 里
          let block = range.startContainer;
          if (block.nodeType === 3) block = block.parentElement;
          while (block && block !== target && BLOCK_TAGS.indexOf(block.tagName) === -1) block = block.parentElement;

          // 创建后续段落，给光标留个落点
          const follow = document.createElement(block && block.tagName === 'P' ? 'p' : 'p');
          if (follow.tagName === 'P') {
            follow.innerHTML = '<br>';
          }
          const frag = document.createDocumentFragment();
          frag.appendChild(hr);
          frag.appendChild(follow);
          if (block && block !== target && block.parentNode) {
            block.parentNode.insertBefore(frag, block.nextSibling);
          } else if (block === target) {
            target.appendChild(frag);
          } else {
            target.appendChild(frag);
          }
          // 把光标移动到新创建的段落里
          const r = document.createRange();
          r.setStart(follow, 0);
          r.collapse(true);
          sel.removeAllRanges();
          sel.addRange(r);
          inserted = true;
        }
      }
      if (!inserted) {
        // 没有可用光标：追加到末尾，并新建一个空 <p> 收尾
        const follow = document.createElement('p');
        follow.innerHTML = '<br>';
        target.appendChild(hr);
        target.appendChild(follow);
        const r = document.createRange();
        r.setStart(follow, 0);
        r.collapse(true);
        const s = window.getSelection();
        if (s) { s.removeAllRanges(); s.addRange(r); }
      }

      // 通知对应 state 同步（依赖现有 oninput/blur 逻辑；下面兜底刷新）
      if (scope === 'news') {
        const cols = document.querySelector('.cols');
        if (cols) {
          state.article = extractParagraphs(cols).join('\n\n');
          const ta = document.querySelector('textarea[data-k="article"]');
          if (ta) ta.value = state.article;
        }
      } else if (scope === 'writer') {
        const div = document.querySelector('.story div.edit[contenteditable][data-edit="writerBody"]');
        if (div) {
          state.writerText = extractParagraphs(div).join('\n\n');
          const ta = document.querySelector('textarea[data-k="writerText"]');
          if (ta) ta.value = state.writerText;
        }
      } else if (scope === 'side') {
        const w = document.getElementById('sideWriter');
        if (w) state.sideArticle = w.innerHTML;
      }
      save();
      showToast('横杠已插入');
    };

        e.onblur = () => pushHistory();
        // v16：正文 textarea 粘贴时自动清洗（多余空行/连续空白/异常换行）
        if (e.tagName === 'TEXTAREA' && (e.dataset.k === 'article' || e.dataset.k === 'writerText')) {
          e.onpaste = (ev) => {
            ev.preventDefault();
            const cd = ev.clipboardData || window.clipboardData;
            if (!cd) return;
            const text = cd.getData('text/plain') || '';
            if (!text) return;
            const clean = paragraphsFromText(text).join('\n\n');
            const start = e.selectionStart, end = e.selectionEnd;
            const val = e.value;
            e.value = val.slice(0, start) + clean + val.slice(end);
            e.selectionStart = e.selectionEnd = start + clean.length;
            state[e.dataset.k] = e.value;
            save();
            liveUpdate(e.dataset.k, e.value);
          };
        }
      });

      // 栏数切换
      document.querySelectorAll('[data-cols]').forEach(e => {
        e.onclick = () => {
          pushHistory();
          state.cols = +e.dataset.cols;
          save();
          const cols = document.querySelector('.cols');
          if (cols) cols.style.columns = state.cols + ' 200px';
          document.querySelectorAll('[data-cols]').forEach(b => b.classList.toggle('on', +b.dataset.cols === state.cols));
        };
      });

      // 图片上传（v16：中段/结尾配图已移除，仅保留主图位）
      ['image','writerImage','sideImage'].forEach(k => {
        const p = document.getElementById(k + 'Pick');
        const f = document.getElementById(k + 'File');
        if (p && f) {
          p.onclick = (ev) => { ev.preventDefault(); f.click(); };
          f.onchange = () => { if (f.files && f.files[0]) handleImageUpload(k, f.files[0]); };
        }
      });

      // contenteditable 同步回 state（输入即同步，不依赖失焦）
      document.querySelectorAll('.edit[contenteditable]').forEach((el) => {
        const key = el.dataset.edit;
        // v16：正文粘贴自动排版 —— 统一成 <p> 段落，清洗多余空行/连续空白/异常换行
        if (key === 'writerBody') {
          el.onpaste = (e) => {
            e.preventDefault();
            const cd = e.clipboardData || window.clipboardData;
            if (!cd) return;
            const text = cd.getData('text/plain') || '';
            if (!text) return;
            insertCleanParagraphs(el, text);
            state.writerText = extractParagraphs(el).join('\n\n');
            const ta = document.querySelector('textarea[data-k="writerText"]');
            if (ta) ta.value = state.writerText;
            save();
          };
        } else if (key === 'articleP') {
          el.onpaste = (e) => {
            e.preventDefault();
            const cd = e.clipboardData || window.clipboardData;
            if (!cd) return;
            const text = cd.getData('text/plain') || '';
            if (!text) return;
            const rawParas = paragraphsFromText(text);
            if (!rawParas.length) return;
            const blocks = blocksFromParagraphs(rawParas); // v18：识别 --- 横杠段
            if (!blocks.length) return;
            const sel = window.getSelection();
            const makeNode = (b) => {
              if (b.hr) return document.createElement('hr');
              const p = document.createElement('p');
              p.className = 'edit';
              p.contentEditable = 'true';
              p.dataset.edit = 'articleP';
              p.textContent = b.p;
              return p;
            };
            let lastNode = null;
            if (sel && sel.rangeCount && sel.getRangeAt(0).intersectsNode(el)) {
              const range = sel.getRangeAt(0);
              // 第一块插入当前光标位置
              const first = blocks.shift();
              range.deleteContents();
              const firstNode = makeNode(first);
              range.insertNode(firstNode);
              lastNode = firstNode;
              // 其余块作为独立元素追加到当前段之后
              blocks.forEach(b => {
                const n = makeNode(b);
                el.after(n);
                lastNode = n;
              });
              range.setStartAfter(lastNode);
              range.collapse(true);
              sel.removeAllRanges();
              sel.addRange(range);
            } else {
              el.textContent = (el.textContent || '') + '\n\n' + rawParas.join('\n\n');
            }
            const cols = el.closest('.cols');
            if (cols) {
              state.article = extractParagraphs(cols).join('\n\n');
              const ta = document.querySelector('textarea[data-k="article"]');
              if (ta) ta.value = state.article;
            }
            save();
          };
        }
        el.oninput = () => {
          const k = el.dataset.edit;
          if (!k) return;
          if (k === 'name') state.name = el.textContent;
          else if (k === 'title') state.title = el.textContent;
          else if (k === 'writerTitle') state.writerTitle = el.textContent;
          else if (k === 'writerBody') {
            state.writerText = extractParagraphs(el).join('\n\n');
            const ta = document.querySelector('textarea[data-k="writerText"]');
            if (ta) ta.value = state.writerText;
          }
          else if (k === 'sideTitle') {
            state.sideSection = el.textContent;
          }
          else if (k === 'articleP') {
            // 收集 .cols 内所有文章段落，合并回 state.article
            const cols = el.closest('.cols');
            if (cols) {
              state.article = extractParagraphs(cols).join('\n\n');
              // 同步面板里的 textarea
              const ta = document.querySelector('textarea[data-k="article"]');
              if (ta) ta.value = state.article;
            }
          }
          else if (k === 'kicker') state.kicker = el.textContent;
          else if (k === 'deck') state.deck = el.textContent;
          else if (k === 'byline') {
            // byline 含日期后缀，只存前面的文字部分
            state.byline = el.textContent.split('\u3000')[0].trim();
          }
          else if (k === 'mastLeft') state.mastLeft = el.textContent;
          else if (k === 'mastRight') state.mastRight = el.textContent;
          else if (k === 'storyTag') state.storyTag = el.textContent;
          else if (k === 'sideMastLeft') state.sideMastLeft = el.textContent;
          else if (k === 'sideMastRight') state.sideMastRight = el.textContent;
          else if (k === 'sideMetaPrefix') state.sideMetaPrefix = el.textContent;
          else if (k === 'sideMetaSuffix') state.sideMetaSuffix = el.textContent;
          else if (k === 'sideSubTag') state.sideSubTag = el.textContent;
          else if (k === 'sideEmptyMsg') state.sideEmptyMsg = el.textContent;
          else if (k === 'waterMark') state.waterMark = el.textContent;
          else if (k === 'navBrand') state.navBrand = el.textContent;
          save();
        };
        el.onblur = () => {
          pushHistory();
          // v16：失焦时清理空段落/空 div，避免删除内容后残留大空白
          if (key === 'writerBody') {
            pruneEmptyBlocks(el);
            state.writerText = extractParagraphs(el).join('\n\n');
            const ta = document.querySelector('textarea[data-k="writerText"]');
            if (ta) ta.value = state.writerText;
            save();
          } else if (key === 'articleP') {
            const cols = el.closest('.cols');
            if (cols) {
              pruneEmptyBlocks(cols);
              state.article = extractParagraphs(cols).join('\n\n');
              const ta = document.querySelector('textarea[data-k="article"]');
              if (ta) ta.value = state.article;
              save();
            }
          }
        };
      });

      // 副业条目 inline 编辑（输入即同步）
      document.querySelectorAll('.editable[contenteditable]').forEach((el) => {
        el.oninput = () => {
          const key = el.dataset.edit;
          const id = el.dataset.id;
          if (!key || !id) return;
          const item = (state.sideEntries || []).find(e => e.id === id);
          if (item) {
            if (key === 'entry-title') item.title = el.textContent;
            else if (key === 'entry-preview') item.preview = el.textContent;
            else if (key === 'entry-date') item.date = el.textContent;
            save();
            // 同步更新左边"已有条目"列表里的标题预览
            const row = document.querySelector(`.entry-row[data-id="${id}"] b`);
            if (row && key === 'entry-title') {
              row.textContent = (item.title || '').slice(0, 22);
              row.title = item.title || '';
            }
          }
        };
        el.onblur = () => pushHistory();
      });

      // 副业写作区：粘贴自动排版（v16：统一清洗 + 按段落插入 <p>）
      const writerEl = document.getElementById('sideWriter');
      if (writerEl) {
        writerEl.onpaste = (e) => {
          e.preventDefault();
          const cd = e.clipboardData || window.clipboardData;
          if (!cd) return;
          const text = cd.getData('text/plain') || '';
          if (!text) return;
          // v18：paste 路径也支持 --- 横杠识别
          insertCleanParagraphs(writerEl, text);
          state.sideArticle = writerEl.innerHTML;
          save();
        };
        writerEl.oninput = () => {
          state.sideArticle = writerEl.innerHTML;
          save();
        };
        writerEl.onblur = () => {
          pushHistory();
          pruneEmptyBlocks(writerEl);
          state.sideArticle = writerEl.innerHTML;
          save();
        };
      }
    }

    // ---- 实时更新预览（不 re-render）----
    function liveUpdate(key, value) {
      if (key === 'name') {
        document.querySelectorAll('.mast b.edit').forEach(el => el.textContent = value);
      } else if (key === 'title') {
        const h1 = document.querySelector('.paper h1.edit');
        if (h1) h1.textContent = value;
      } else if (key === 'edition') {
        document.querySelectorAll('.mast span.edit').forEach((el, i) => { if (i === 1) el.textContent = value + ' · 亚洲'; });
      } else if (key === 'article') {
        const cols = document.querySelector('.cols');
        if (cols) {
          // v18：支持 --- 横杠段（识别后渲染为 <hr> 节点）
          const rawParas = value.split(/\n\s*\n/).filter(Boolean);
          const blocks = blocksFromParagraphs(rawParas);
          cols.innerHTML = renderBlocksHtml(blocks, { contenteditable: true, dataEdit: 'articleP' });
          bind();
        }
      } else if (key === 'writerTitle') {
        const h1 = document.querySelector('.story h1.edit');
        if (h1) h1.textContent = value;
      } else if (key === 'writerText') {
        const div = document.querySelector('.story div.edit[contenteditable]');
        if (div) {
          const rawParas = value.split(/\n\s*\n/).filter(Boolean);
          const blocks = blocksFromParagraphs(rawParas);
          div.innerHTML = renderBlocksHtml(blocks);
        }
      }
    }

    // ---- 渲染 ----
    function render() {
      document.querySelectorAll('[data-tab]').forEach(b =>
        b.classList.toggle('on', b.dataset.tab === state.tab));
      applyTheme();
      app.innerHTML = state.tab === 'news' ? newsView() :
                      state.tab === 'write' ? writeView() : sideView();
      bind();
      save();
      updateUndoBtn();
      // 手机端：切 tab 后默认折叠操作台（除非用户刚刚手动展开过）
      if (window.matchMedia && window.matchMedia('(max-width: 768px)').matches) {
        const p = document.getElementById('appPanel');
        if (p && !panelUserExpanded) p.classList.add('collapsed');
      }
    }

    // ---- Tab 切换 ----
    document.querySelectorAll('[data-tab]').forEach(b => {
      b.onclick = () => {
        pushHistory();
        state.tab = b.dataset.tab;
        save();
        render();
      };
    });

    // ---- 撤销按钮 ----
    document.getElementById('undoBtn').addEventListener('click', undo);

    // ---- 移动端：面板折叠 ----
    const panelToggle = document.createElement('button');
    panelToggle.className = 'panel-toggle';
    panelToggle.title = '展开/收起操作台';
    panelToggle.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>';
    panelToggle.onclick = () => {
      const p = document.getElementById('appPanel');
      if (!p) return;
      p.classList.toggle('collapsed');
      // 记录当前状态：true = 展开（render 时不再自动折叠），false = 折叠
      panelUserExpanded = !p.classList.contains('collapsed');
    };
    document.querySelector('.nav .tabs').after(panelToggle);

    // ---- 键盘快捷键：⌘Z 撤销 ----
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) {
        const t = e.target;
        if (t && (t.tagName === 'TEXTAREA' || t.tagName === 'INPUT') && window.getSelection && window.getSelection().toString() === '') {
          // 留空，让原生撤销生效
        } else {
          e.preventDefault();
          undo();
        }
      }
    });

    // ---- 启动 ----
    // v16：确保 contenteditable 里按回车创建的是 <p> 段落（而不是 <div>），
    // 从源头避免「粘贴/输入内容与 state 同步丢失」的问题。
    try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch(e) {}
    applyTheme();
    pushHistory();
    render();

    // v16：页面切后台/退出前强制落盘，防止草稿丢失
    window.addEventListener('pagehide', saveNow);
    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'hidden') saveNow();
    });

    // 在手机上默认折叠面板，节省垂直空间
    if (window.matchMedia && window.matchMedia('(max-width: 768px)').matches) {
      const p = document.getElementById('appPanel');
      if (p && !panelUserExpanded) p.classList.add('collapsed');
    }

    // ---- Add to Home Screen hint (shows once on iPhone) ----
    (function(){
      var shown = false;
      try { shown = localStorage.getItem('a2hs_dismissed') === '1'; } catch(e){}
      if (shown) return;
      function isIOS(){ return /iPhone|iPad|iPod/.test(navigator.userAgent) && !window.MSStream; }
      function isStandalone(){ return window.navigator.standalone === true || window.matchMedia('(display-mode:standalone)').matches; }
      if (!isIOS() || isStandalone()) return;
      setTimeout(function(){
        var hint = document.createElement('div');
        hint.id = 'a2hs-hint';
        hint.style.cssText = 'position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#20221f;color:#f7f3e9;padding:16px 20px;border-radius:12px;font-size:14px;z-index:9998;max-width:90vw;box-shadow:0 4px 24px rgba(0,0,0,.4);display:flex;align-items:center;gap:12px;font-family:-apple-system,system-ui,sans-serif;line-height:1.5;transition:opacity .4s,transform .4s';
        hint.innerHTML = '<div style="flex:1;min-width:0"><b style="color:#d5b96f;font-size:13px">\u2B50 \u6DFB\u52A0\u5230\u4E3B\u5C4F</b><br><span style="font-size:12px;color:#bbb7ae">\u70B9\u51FB\u5E95\u90E8\u5206\u4EAB\u6309\u94AE \u2192 \u300C\u6DFB\u52A0\u5230\u4E3B\u5C4F\u5E55\u300D</span></div><button id="a2hs-close" style="background:none;border:0;color:#888;font-size:22px;padding:0 4px;cursor:pointer;flex-shrink:0">\u00D7</button>';
        document.body.appendChild(hint);
        var closeBtn = document.getElementById('a2hs-close');
        if (closeBtn) closeBtn.addEventListener('click', function(){
          hint.style.opacity = '0';
          hint.style.transform = 'translateX(-50%) translateY(20px)';
          setTimeout(function(){ hint.remove(); }, 400);
          try { localStorage.setItem('a2hs_dismissed', '1'); } catch(e){}
        });
        setTimeout(function(){
          if (hint && hint.parentNode) {
            hint.style.opacity = '0';
            setTimeout(function(){ if(hint && hint.parentNode) hint.remove(); }, 400);
          }
        }, 12000);
      }, 2500);
    })();

    
  </script>
  <!-- 浮动横杠按钮（跟随屏幕，写到哪都能点） -->
  <div class="float-hr hide" id="floatHr" title="插入水平横杠"></div>
  <script>
    (function(){
      var btn = document.getElementById('floatHr');
      if(!btn) return;
      var scopeMap = {news:'news', write:'writer', side:'side'};
      // 监听 state.tab 变化来显示/隐藏 + 设置 scope
      function updateFloatHr(){
        var scope = scopeMap[window.state && window.state.tab] || '';
        if(scope){
          btn.classList.remove('hide');
          btn.onclick = function(){ if(window.insertHr) window.insertHr(scope); };
        }else{
          btn.classList.add('hide');
          btn.onclick = null;
        }
      }
      // MutationObserver 监听 #app 子节点变化（render 会重写 app.innerHTML）
      var app = document.getElementById('app');
      if(app){
        new MutationObserver(updateFloatHr).observe(app, {childList:true, subtree:false});
      }
      // 也监听 localStorage 变化（跨 tab 恢复时）
      window.addEventListener('storage', updateFloatHr);
      // 初始化
      updateFloatHr();
    })();
  </script>
</body>
